name: Glass Imaging
description: 'Glass Imaging is a Los Altos, California AI company that enhances image and video quality
  on smartphones and imaging devices. Its GlassAI technology uses machine learning to reverse lens
  aberrations and sensor imperfections, extracting the full image-quality potential of camera hardware
  by removing noise, blur, and artifacts. The company ships a Custom Neural ISP that boosts camera
  performance up to 10x on edge AI-enabled devices, and a Co-Designed AI + Optics approach for
  space-constrained (SWaP) cameras. Glass Imaging sells to smartphone and device manufacturers and
  is venture-backed by Google Ventures, LDV Capital, Future Ventures, Abstract Ventures, Ground Up,
  and Insight Partners. This is a company profile in the API Evangelist network; Glass Imaging does
  not currently publish a public developer API, SDK, or documentation surface.'
